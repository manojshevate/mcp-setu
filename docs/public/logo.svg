<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64" width="200" height="64">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Left node (Ollama) -->
  <circle cx="20" cy="32" r="10" fill="url(#logoGrad)"/>

  <!-- Right node (MCP Servers) -->
  <circle cx="52" cy="32" r="10" fill="url(#logoGrad)"/>

  <!-- Middle bridge node -->
  <circle cx="36" cy="32" r="7" fill="#8b5cf6"/>

  <!-- Connection lines -->
  <line x1="30" y1="32" x2="29" y2="32" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <line x1="43" y1="32" x2="42" y2="32" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>

  <!-- Text: mcp-setu -->
  <text x="70" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#1f2937" letter-spacing="-0.5">
    mcp-setu
  </text>
</svg>