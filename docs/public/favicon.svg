<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" fill="white"/>
  <!-- Left node (Ollama) -->
  <circle cx="8" cy="16" r="4" fill="url(#grad1)"/>
  <!-- Right node (MCP) -->
  <circle cx="24" cy="16" r="4" fill="url(#grad1)"/>
  <!-- Middle bridge -->
  <circle cx="16" cy="16" r="3" fill="#8b5cf6"/>
  <!-- Connecting lines -->
  <line x1="12" y1="16" x2="13" y2="16" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="19" y1="16" x2="20" y2="16" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round"/>
</svg>