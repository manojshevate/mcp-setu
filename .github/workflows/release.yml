name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Get version from tag
      id: tag_name
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Build binary
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
      run: |
        VERSION=${{ steps.tag_name.outputs.VERSION }}
        COMMIT=${{ github.sha }}
        BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        OUTPUT_NAME="mcpgo_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}"

        if [ "${{ matrix.os }}" = "windows" ]; then
          OUTPUT_NAME="${OUTPUT_NAME}.exe"
        fi

        go build \
          -ldflags="-X github.com/manojshevate/mcpgo/internal/version.Version=${VERSION} \
                    -X github.com/manojshevate/mcpgo/internal/version.Commit=${COMMIT} \
                    -X github.com/manojshevate/mcpgo/internal/version.BuildDate=${BUILD_DATE}" \
          -o "${OUTPUT_NAME}" \
          ./cmd/mcpgo

    - name: Create tarball/zip
      run: |
        VERSION=${{ steps.tag_name.outputs.VERSION }}
        if [ "${{ matrix.os }}" = "windows" ]; then
          zip -j "mcpgo_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}.zip" "mcpgo_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}.exe"
          rm "mcpgo_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}.exe"
        else
          tar -czf "mcpgo_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" "mcpgo_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}"
          rm "mcpgo_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}"
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: releases-${{ matrix.os }}-${{ matrix.arch }}
        path: mcpgo_*

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Flatten artifacts
      run: |
        mkdir -p release-files
        find artifacts -type f -name "mcpgo_*" -exec mv {} release-files/ \;

    - name: Generate checksums
      run: |
        cd release-files
        sha256sum mcpgo_* > checksums.txt
        cat checksums.txt

    - name: Get version
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: actions/create-release@v1
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        release_name: Release ${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: ${{ contains(steps.version.outputs.VERSION, 'dev') || contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') }}

    - name: Upload release assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd release-files
        for file in mcpgo_* checksums.txt; do
          gh release upload ${{ steps.version.outputs.VERSION }} "$file"
        done

  update-homebrew:
    name: Update Homebrew Formula
    needs: create-release
    runs-on: ubuntu-latest
    if: '!contains(github.ref, ''dev'') && !contains(github.ref, ''alpha'') && !contains(github.ref, ''beta'')'

    steps:
    - uses: actions/checkout@v4

    - name: Get version and artifacts
      id: release_info
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Download checksums
      run: |
        gh release download ${{ steps.release_info.outputs.VERSION }} -p "checksums.txt"
        cat checksums.txt

    - name: Generate SHA256 for macOS amd64
      id: sha_amd64
      run: |
        SHA=$(grep "darwin_amd64.tar.gz" checksums.txt | awk '{print $1}')
        echo "SHA=$SHA" >> $GITHUB_OUTPUT

    - name: Generate SHA256 for macOS arm64
      id: sha_arm64
      run: |
        SHA=$(grep "darwin_arm64.tar.gz" checksums.txt | awk '{print $1}')
        echo "SHA=$SHA" >> $GITHUB_OUTPUT

    - name: Checkout homebrew-tap
      uses: actions/checkout@v4
      with:
        repository: manojshevate/homebrew-tap
        token: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}
        path: homebrew-tap

    - name: Update formula
      run: |
        VERSION=${{ steps.release_info.outputs.VERSION }}
        CAT << 'EOF' > homebrew-tap/Formula/mcpgo.rb
class Mcpgo < Formula
  desc "MCP bridge for Ollama"
  homepage "https://github.com/manojshevate/mcpgo"

  on_macos do
    on_arm do
      url "https://github.com/manojshevate/mcpgo/releases/download/${VERSION}/mcpgo_${VERSION}_darwin_arm64.tar.gz"
      sha256 "${{ steps.sha_arm64.outputs.SHA }}"
    end
    on_intel do
      url "https://github.com/manojshevate/mcpgo/releases/download/${VERSION}/mcpgo_${VERSION}_darwin_amd64.tar.gz"
      sha256 "${{ steps.sha_amd64.outputs.SHA }}"
    end
  end

  version "${VERSION}"
  license "MIT"

  def install
    bin.install "mcpgo"
  end

  def test
    assert_match "mcpgo version", shell_output("#{bin}/mcpgo version")
  end
end
EOF

    - name: Commit and push to homebrew-tap
      run: |
        cd homebrew-tap
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add Formula/mcpgo.rb
        git commit -m "chore: update mcpgo formula to ${{ steps.release_info.outputs.VERSION }}" || true
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}
